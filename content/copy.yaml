# ---------------------------------------------------------------- jewellery
jewellery:
  title: "The Jewellery Paper · Jaipur's jewellery trade, in public records · {{brand}}"
  description: >-
    Free, independent data on Jaipur's jewellery and gem trade: exports, the US tariff, the emerald trade, and what
    they mean for makers and shops at home. Updated monthly.
  headline: "Jewellery is live."
  statement: >-
    Jaipur cuts, sets and ships jewellery to the world. What's happening to that trade is in public data, buried in
    customs tables and trade reports. I dug through them, checked every figure, and put them in one place.
  action: "Open The Jewellery Paper"
  act_num: "{{jewellery.gold_share}}%"
  act_cap: "of what Jaipur's export zone ships is gold jewellery. Every figure from a public record, checked."
  note: "Free. Figures updated each month. Nothing for sale."
  questions_headline: "What it answers."
  questions:
    - ["Who took India's silver-jewellery business in America while the tariff was on, and is it coming back?", "For silver exporters"]
    - ["What's happening to the price of the emerald rough that Jaipur's cutters buy?", "For gem dealers and cutters"]
    - ["Plain gold or studded, silver or coloured stones: which exports are growing, and which are shrinking?", "For gold makers and exporters"]
    - ["What do the wedding season, metal prices and visitors mean for shops at home?", "For shops in the city"]
  found_headline: "What it's found so far."
  found_lede: "Three of them, one at a time. Each is read from a public record and checked by separate code."
  how: "How I know"
  more: "Read it in full"
  next: "Next finding"
  end_text: "That's three of them. The rest, with their charts, are in The Jewellery Paper. Want to see them?"
  end_go: "Yes, take me there"
  again: "Start again"
  close_headline: "Get it each month."
  close_text: "Leave your WhatsApp number and you'll hear when the jewellery figures update. Nothing else, nothing for sale."
  close_action: "Get the monthly update"

# ---------------------------------------------------------------- about
about:
  title: "About · Who's behind {{brand}} and how it's made"
  description: >-
    {{brand}} is free, independent research on Jaipur's industries by Sarthak Oberoi, a data analyst who grew up in
    Jaipur. How it's made, and why it's free.
  headline: "Who's behind it."
  paras:
    - "I'm Sarthak Oberoi, a data analyst who grew up in Jaipur. I study how businesses win and lose in markets like this one."
    - >-
      In any market, someone is ahead because they know something the others don't. It rarely sits in the big,
      obvious numbers. It hides in the part nobody thinks to check: the hour you open, how your listing reads on one
      app, what a customer mentions in passing. My work is finding that edge and writing it down in plain words,
      along with where it stops.
    - >-
      Cafés came first because I was sitting in them anyway, so I may as well count them. Jewellery came next because
      it's the trade this city is known for around the world.
    - >-
      I run this on my own and keep it free. No platform or business pays to appear, nothing here is for sale, and
      no business is ever criticised.
  method_headline: "How it's made."
  method:
    - "**Sourced and dated.** Every figure comes from public data, with its source and the date it was collected. A blank beats a guess."
    - "**Aggregates only.** Every number describes a group of businesses. Small groups are hidden, and no business is singled out."
    - "**Graded, with limits.** Each finding is graded for how far you can lean on it, and says what it doesn't prove."
    - "**Free and independent.** No platform or business pays to appear. The code is open source."
  credits_headline: "Photographs."
  credits_lede: "All from Unsplash, used under the Unsplash licence. None shows a business measured here."

